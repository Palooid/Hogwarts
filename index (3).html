<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hogwarts Reader & Editor</title>
  <style>
    :root {
      --bg: #f6f1e7;
      --panel: #fffdf8;
      --panel-2: #f3eadf;
      --accent: #7a1f2b;
      --accent-2: #a93748;
      --text: #201d1a;
      --muted: #685f57;
      --line: #e3d9ca;
      --success: #1f7a4a;
      --danger: #a83232;
      --shadow: rgba(32, 29, 26, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--bg), #efe7da);
      color: var(--text);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      font-weight: 800;
      letter-spacing: 0.03em;
      color: var(--accent);
    }

    .brand-badge {
      display: inline-flex;
      width: 52px;
      height: 52px;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
      font-size: 26px;
      box-shadow: 0 10px 20px rgba(122, 31, 43, 0.18);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 440px) 1fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 14px 26px var(--shadow);
    }

    .form-card {
      padding: 24px;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 1.6rem;
      color: var(--accent);
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--text);
    }

    input, textarea, button {
      font: inherit;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      padding: 12px 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(122, 31, 43, 0.12);
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .primary-btn {
      background: var(--accent);
      color: white;
      width: 100%;
    }

    .secondary-btn {
      background: #f1eadf;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .status {
      min-height: 24px;
      margin-top: 16px;
      font-size: 0.96rem;
      color: var(--muted);
    }

    .status.success {
      color: var(--success);
    }

    .status.error {
      color: var(--danger);
    }

    .books-card {
      padding: 20px;
    }

    .books-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .books-header h2 {
      margin: 0;
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .book {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.03);
    }

    .book h3 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 1.1rem;
      line-height: 1.35;
    }

    .book .meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .book p {
      margin: 0;
      color: var(--text);
      line-height: 1.6;
      font-size: 0.95rem;
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-wrap;
    }

    .empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,0.35);
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <span class="brand-badge">📚</span>
        <span>Hogwarts</span>
      </div>
    </header>

    <main class="layout">
      <section class="card form-card">
        <h2>Добавить книгу</h2>

        <form id="bookForm">
          <div class="field">
            <label for="title">Название</label>
            <input id="title" name="title" type="text" placeholder="Например: Гарри Поттер" required />
          </div>

          <div class="field">
            <label for="author">Автор</label>
            <input id="author" name="author" type="text" placeholder="Кто написал книгу?" required />
          </div>

          <div class="field">
            <label for="content">Текст</label>
            <textarea id="content" name="content" placeholder="Введите текст книги..." required></textarea>
          </div>

          <button class="primary-btn" type="submit">Опубликовать</button>
          <div id="status" class="status" aria-live="polite"></div>
        </form>
      </section>

      <section class="card books-card">
        <div class="books-header">
          <h2>Библиотека</h2>
          <button class="secondary-btn" id="reloadBtn" type="button">Обновить</button>
        </div>

        <div id="booksList" class="book-grid"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://nhqefivmcaieohvsxhmh.supabase.co';
    const supabaseKey = 'sb_publishable_N5sI_VoJ6sq54_eMhp3bMQ_HpLtfSqM';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    const form = document.getElementById('bookForm');
    const statusEl = document.getElementById('status');
    const booksList = document.getElementById('booksList');
    const reloadBtn = document.getElementById('reloadBtn');

    function setStatus(message, type = '') {
      statusEl.textContent = message;
      statusEl.className = 'status';
      if (type) statusEl.classList.add(type);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function loadBooks() {
      try {
        const { data, error } = await supabase
          .from('books')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          booksList.innerHTML = '<div class="empty">Пока книг нет. Добавьте первую книгу.</div>';
          return;
        }

        booksList.innerHTML = data.map((book) => {
          const created = book.created_at ? new Date(book.created_at).toLocaleDateString('ru-RU') : 'сегодня';
          return `
            <article class="book">
              <h3>${escapeHtml(book.title)}</h3>
              <div class="meta">
                <span>${escapeHtml(book.author)}</span>
                <span>${created}</span>
              </div>
              <p>${escapeHtml(book.content)}</p>
            </article>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
        booksList.innerHTML = '<div class="empty">Не удалось загрузить книги. Проверьте подключение к Supabase и таблицу <strong>books</strong>.</div>';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const title = document.getElementById('title').value.trim();
      const author = document.getElementById('author').value.trim();
      const content = document.getElementById('content').value.trim();

      if (!title || !author || !content) {
        setStatus('Заполните все поля.', 'error');
        return;
      }

      try {
        setStatus('Сохраняем книгу...', '');

        const { error } = await supabase.from('books').insert([
          {
            title,
            author,
            content,
            created_at: new Date().toISOString()
          }
        ]);

        if (error) throw error;

        form.reset();
        setStatus('Книга успешно добавлена!', 'success');
        await loadBooks();
      } catch (err) {
        console.error(err);
        setStatus('Ошибка сохранения: ' + (err.message || 'Неизвестная ошибка'), 'error');
      }
    });

    reloadBtn.addEventListener('click', loadBooks);

    loadBooks();
  </script>
</body>
</html>
